name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create dist directory and copy files
        run: |
          mkdir -p dist
          
          # Verify critical files exist
          if [ ! -f "index.html" ]; then
            echo "Error: index.html not found"
            exit 1
          fi
          
          # Copy all HTML files (required)
          cp *.html dist/
          
          # Copy directories (required)
          cp -r css dist/
          cp -r js dist/
          cp -r assets dist/
          
          # Copy optional directories
          cp -r data dist/ 2>/dev/null || echo "Note: data directory not found, skipping"
          cp -r archive dist/ 2>/dev/null || echo "Note: archive directory not found, skipping"
          
          # Copy configuration files (optional)
          cp _headers dist/ 2>/dev/null || echo "Note: _headers not found, skipping"
          cp _redirects dist/ 2>/dev/null || echo "Note: _redirects not found, skipping"
          
          echo "Files copied to dist directory"
          ls -la dist/
      
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_TOKEN }}
          channelId: live
          projectId: glenn-ehs-website
